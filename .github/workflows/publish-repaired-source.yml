name: Publish repaired EvidenceQuorum source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Replace flattened bundle with verified source project
        env:
          ARCHIVE_URL: https://files.manuscdn.com/user_upload_by_module/session_file/310419663026813927/zhVHjuZgJQrYRttQ.zip
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARCHIVE_URL" --output /tmp/evidencequorum-source.zip
          rm -rf /tmp/evidencequorum-source
          mkdir -p /tmp/evidencequorum-source
          unzip -q /tmp/evidencequorum-source.zip -d /tmp/evidencequorum-source
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/evidencequorum-source/. .
          git add -A
          git config user.name "farzad-eth"
          git config user.email "farzad-eth@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Repair EvidenceQuorum source package and live GenLayer client"
            git push origin main
          fi
